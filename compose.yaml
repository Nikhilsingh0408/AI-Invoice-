name: invoice-auditor

services:
  postgres:
    image: postgres:16.6-alpine
    restart: unless-stopped
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  qdrant:
    image: qdrant/qdrant:v1.12.5
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 && printf \"GET /readyz HTTP/1.0\\r\\n\\r\\n\" >&3 && grep -q 200 <&3'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  redis:
    image: redis:7.4.1-alpine
    restart: unless-stopped
    command: redis-server --save "" --appendonly no --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  mock-erp:
    build: ./mock_erp
    image: invoice-auditor-mock-erp:1.0
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    ports:
      - "8001:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy

  agent-data-init:
    image: invoice-auditor-agent:1.0
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mkdir -p /data/incoming /data/processed /data/pending /data/rejected /data/failed /reports
        && chown ${LOCAL_UID:-1000}:${LOCAL_GID:-1000}
        /data /data/incoming /data/processed /data/pending /data/rejected /data/failed /reports
    volumes:
      - ./data:/data
      - ./outputs/reports:/reports
    restart: "no"

  agent:
    build: ./agent
    image: invoice-auditor-agent:1.0
    restart: on-failure:3
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MOCK_ERP_URL: http://mock-erp:8000
      INCOMING_DIR: /data/incoming
      PROCESSED_DIR: /data/processed
      PENDING_DIR: /data/pending
      REJECTED_DIR: /data/rejected
      FAILED_DIR: /data/failed
      REPORTS_DIR: /reports
      CONFIG_DIR: /app/config
      AWS_SHARED_CREDENTIALS_FILE: /aws/credentials
      AWS_CONFIG_FILE: /aws/config
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
      - ./outputs/reports:/reports
      - ./config:/app/config:ro
      - ${HOME}/.aws:/aws:ro
    depends_on:
      agent-data-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
      mock-erp:
        condition: service_healthy

  streamlit-ui:
    build: ./streamlit_ui
    image: invoice-auditor-ui:1.0
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      AGENT_URL: http://agent:8000
    ports:
      - "8501:8501"
    depends_on:
      postgres:
        condition: service_healthy
      agent:
        condition: service_healthy

volumes:
  postgres_data:
  qdrant_data:

